<svg xmlns="http://w3.org" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <g id="flower-orange">
      <circle cx="0" cy="0" r="8" fill="#e65c00" />
      <circle cx="0" cy="0" r="5" fill="#ff9900" />
    </g>
    <g id="flower-yellow">
      <circle cx="0" cy="0" r="8" fill="#ffcc00" />
      <circle cx="0" cy="0" r="4" fill="#ffee55" />
    </g>
    
    <path id="leaf" d="M0,0 C-6,15 -8,30 0,45 C8,30 6,15 0,0 Z" fill="#2d7a2d" stroke="#1e541e" stroke-width="0.5"/>
    
    <g id="string">
      <line x1="0" y1="0" x2="0" y2="90" stroke="#ffcc00" stroke-width="2" stroke-dasharray="2,6"/>
      <use href="#flower-orange" x="0" y="15"/>
      <use href="#flower-yellow" x="0" y="30"/>
      <use href="#flower-orange" x="0" y="45"/>
      <use href="#flower-yellow" x="0" y="60"/>
      <use href="#flower-orange" x="0" y="75"/>
      <use href="#flower-yellow" x="0" y="90"/>
      <use href="#leaf" x="0" y="92" transform="scale(0.8)"/>
    </g>

    <g id="arc-segment">

      <path d="M 0,0 Q 100,55 200,0 L 200,15 Q 100,70 0,15 Z" fill="#800000"/>

      <path d="M 0,12 Q 100,62 200,12" fill="none" stroke="#ff9900" stroke-width="8" stroke-dasharray="12,4"/>
      <path d="M 0,12 Q 100,62 200,12" fill="none" stroke="#ffcc00" stroke-width="4" stroke-dasharray="6,10"/>
      
      <use href="#leaf" x="35" y="30" transform="rotate(-20 35 30)"/>
      <use href="#leaf" x="70" y="42" transform="rotate(-10 70 42)"/>
      <use href="#leaf" x="100" y="45"/>
      <use href="#leaf" x="130" y="42" transform="rotate(10 130 42)"/>
      <use href="#leaf" x="165" y="30" transform="rotate(20 165 30)"/>
    </g>
  </defs>

  <g id="full-divider">
    <g transform="translate(0,0)">
      <use href="#arc-segment"/>
      <use href="#string" x="0" y="15"/>
      <use href="#string" x="100" y="55"/>
    </g>
    
    <g transform="translate(200,0)">
      <use href="#arc-segment"/>
      <use href="#string" x="100" y="55"/>
    </g>
    
    <g transform="translate(400,0)">
      <use href="#arc-segment"/>
      <use href="#string" x="100" y="55"/>
      <use href="#string" x="200" y="15"/>
    </g>

    <g transform="translate(600,0)">
      <use href="#arc-segment"/>
      <use href="#string" x="100" y="55"/>
    </g>

    <g transform="translate(800,0)">
      <use href="#arc-segment"/>
      <use href="#string" x="100" y="55"/>
    </g>

    <g transform="translate(1000,0)">
      <use href="#arc-segment"/>
      <use href="#string" x="100" y="55"/>
      <use href="#string" x="200" y="15"/>
    </g>
  </g>
</svg>
